[CMDLINE]
CMDLINE_CMD_DESC=OSS Maintenance Suite Command Line Interface
CMDLINE_QUIET_MODE=Quiet mode
CMDLINE_HELP=Display the Help information
CMDLINE_LANG_EN=Specify that only information in English is displayed.
CMDLINE_LANG_ZH=Specify that only information in Chinese is displayed.
CMDLINE_ERROR_FILE=Export the error information to a specific file. If this parameter is not specified, the error information is only exported to the standard error output by default.
CMDLINE_DEPLOY_MAINNMS=First deployment of host
CMDLINE_DEPLOY_MAINNMS_IP=Specify the IP address of the host to be deployed. If the host has multiple IP addresses, specify an IP address that can be accessed by the external network. Make sure that the local IP address is not used.
CMDLINE_DEPLOY_MAINNMS_PORT=Specify the port of the host to be deployed. If the port is not specified, the host is logged in by using the default port.
CMDLINE_DEPLOY_MAINNMS_PWD=Specify the password of the server of the OSS maintenance suite to be deployed. If no password is specified, the default password is used.
CMDLINE_DEPLOY_MAINNMS_IMAP=Specify the path of the IMAP environment variable.
CMDLINE_DEPLOY_MAINNMS_DBPATH=Specify the installation path of the database, which needs to set only in UNIX. By default, the path is /opt/Sybase.
CMDLINE_DEPLOY_MAINNMS_DBPWD=Specify the database password. If the password is empty, do not input it.
CMDLINE_DEPLOY_MAINNMS_INITDB=Initialize the database during initial deployment. Generally, this parameter is invoked only by the installation CD-ROM.
CMDLINE_DEPLOY_MAINNMS_INITDM=Initialize the DM tool during initial deployment. Generally, this parameter is invoked only by the installation CD-ROM.
CMDLINE_DEPLOY_MAINNMS_INITICMR=Initialize the ICMR tool during initial deployment. Generally, this parameter is invoked only by the installation CD-ROM.
CMDLINE_DEPLOY_MAINNMS_HA=Specify the HA system type. If not specified, the single server mode is used by default.
CMDLINE_DEPLOY_MAINNMS_DATASIZE=Specify the size of the HA system space allocated to the database. 
CMDLINE_DISTRIBUE_MODE=Specify the multiple deployment mode to log in to the host.
CMDLINE_LOGIN=You need to log in to the server of the OSS maintenance suite before you perform all operations except initial deployment
CMDLINE_LOGIN_IP=Specify the IP address of the server of the OSS maintenance suite to which you want to log in.
CMDLINE_LOGIN_PORT=Specify the port of the server of the OSS maintenance suite to which you want to log in. If no port is specified, the default port is used.
CMDLINE_LOGIN_PWD=Specify the password of the server of the OSS maintenance suite to which you want to log in. If no password is specified, the default password is used.
CMDLINE_BUILD_HA=Synchronize primary and secondary nodes. To construct an HA system, two computers that are respectively deployed in the HA mode are combined into one complete HA system.
CMDLINE_PRI_IP=IP address of the primary server of the HA system.
CMDLINE_PRI_PROT=Specify the port of the OSS maintenance suite on the primary server of the HA system. If no port is specified, the default port is used.
CMDLINE_PRI_DPPWD=Specify the password of the network management system maintenance suite on the primary server of the HA system. If no password is specified, the default password is used.
CMDLINE_SEC_IP=Specify the IP address of the secondary server in the HA system. If the host has multiple IP addresses, specify an IP address that can be accessed by the outside network. Make sure the local IP address is not used.
CMDLINE_SEC_PORT=Specify the port of the OSS maintenance suite on the secondary server of the HA system. If no port is specified, the default port is used.
CMDLINE_SEC_DPPWD=Specify the password of the OSS maintenance suite on the secondary server of the HA system. If no password is specified, the default password is used.
CMDLINE_BUILDHA_EX=Extended parameter, used only for the HA system (1:N cold standby)
CMDLINE_SPLIT_HA=Separate primary and secondary nodes. To divide an HA system, a complete HA system is divided into two independent computers.
CMDLINE_MODIFYPWD=Change the password of the server of the OSS maintenance suite
CMDLINE_MODIFYPWD_OLDPWD=Old password
CMDLINE_MODIFYPWD_NEWPWD=New password
CMDLINE_DEPLOYINS=Add instance (Note: Running the deployNbi command to add a CORBA instance is not supported temporarily.)
CMDLINE_DEPLOYINS_HOST=Specify the host name of the instance to be added. If the host name is not specified, the instance is added on the host by default
CMDLINE_DEPLOYINS_SYS=Specify the component name of the instance to be deployed.
CMDLINE_DEPLOYINS_INS=Specify the instance name (a single-instance component does not require the specification.)
CMDLINE_DEPLOYINS_MEMO=Specify the memo of the instance.
CMDLINE_AUTODEPLOYINS=Automatic Deployment (Instances are automatically deployed based on the license)
CMDLINE_AUTODEPLOYINS_LICENSE=Specify the license path. Note that the license should be saved on the server and the path should be the license path on the server.
CMDLINE_RMINS=Delete instance
CMDLINE_RMINS_INS=Specify the instance name (the instance name of a single-instance component is the component name)
CMDLINE_CHANGEINSINFO=Modify the Instance Information
CMDLINE_CHANGEINSINFO_INS=Specify the name of the instance to be modified.
CMDLINE_CHANGEINSINFO_NEWNAME=Specify a new name for the instance. If not, keep the original name.
CMDLINE_CHANGEINSINFO_MEMO=Specify the new remarks of the instance. If not, keep the original remarks.
CMDLINE_EXPORTBAK=Backup the OSS information
CMDLINE_EXPORTBAK_SAVEPATH=Specify the path of the directory of the backup file. If the parameters are not specified, the default backup directory saved on the system maintenance tool client is used.
CMDLINE_EXPORTBAK_SKIPBAKMO=Not back up the MO data. The system maintenance tool backs up the MO data by default. If the parameter is specified, the system maintenance tool does not back up the MO data.
CMDLINE_IMPORTBAK=Restore the OSS information
CMDLINE_IMPORTBAK_BAKPATH=Specify the backup directory path to be restored. If the file is saved in the default backup directory, input the name of the backup directory directly.
CMDLINE_LISTSYS=List all subsystems.
CMDLINE_LISTINS=List all instance names.
CMDLINE_LISTINS_HOST=Specify the computer name. If the computer name is not specified, instances of all the computers are listed.
CMDLINE_LISTINS_SYS=Specify the component name. If the component name is not specified, instances of all the subsystems are listed.
CMDLINE_LISTHOST=List all hosts.
CMDLINE_STARTINS=Start instance
CMDLINE_STARTINS_INS=Specify the name of the instance to be started (input the component name in the case of a single-instance component)
CMDLINE_STOPINS=Stop instance
CMDLINE_STOPINS_INS=Specify the name of the instance to be stopped (input the component name in the case of a single-instance component)
CMDLINE_SYNCSYS=Re-synchronize the system
CMDLINE_SYNC_HOSTADDR=Synchronize the IP address and name of the host. Note that the host name is automatically obtained and you need not input the host name.
CMDLINE_FORCE=Do not check whether the new IP address and host name are correct. Forcibly synchronize the host name and IP address.
CMDLINE_NEW_IP=New IP address. If the IP address is not specified, the login IP address is used as the new IP address.
CMDLINE_NEW_HOST=New host name. The new host name must be used with the -force parameter. If the host name is not specified, the new host name is automatically detected.
CMDLINE_QUOTE_IPADDR=IP address. The format is xxx.xxx.xxx.xxx.
CMDLINE_QUOTE_PORT=Port, which is composed of 4 to 6 digits.
CMDLINE_QUOTE_PWD=Password, which is composed of multiple non-null characters
CMDLINE_QUOTE_HOSTNAME=Host name, which is composed of multiple non-null characters.
CMDLINE_QUOTE_FLAG=local or remote
CMDLINE_QUOTE_PATH=Path of the file or directory. You are advised to use the relative path.
CMDLINE_QUOTE_HATYPE=HA type. 0: single server 1: Veritas hot standby 2: Veritas warm standby 3: Watchman 4: SunCluster local HA 5: Huawei 1:N cold standby
CMDLINE_QUOTE_SYSNAME=Specify the component name. You can run the listsys command to view the component. Note that the component name is case sensitive.
CMDLINE_QUOTE_INSNAME=Instance name. Note that the instance name is case sensitive.
CMDLINE_QUOTE_MEMO=Remarks of the instance. Input \n to indicate Enter.
CMDLINE_QUOTE_SIZE=Size (MB) of the disk space. Only digits are allowed.
CMDLINE_QUOTE_DBSTOREPATH=The path for saving the database device files.
CMDLINE_QUOTE_EXPARA=The extended parameter is expressed in the format of "parameter 1 = value 1; parameter 2 = value 2...". If a parameter value contains "=" or ":", specify the escape character "\"
