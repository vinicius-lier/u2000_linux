CMDLINE_SYNCSYS=Synchronizing the OSS Data
CMDLINE_SYNC_HOSTADDR=Synchronize the IP address and name of the host. Note that the host name is automatically obtained and you need not input the host name.
CMDLINE_FORCE=Do not check whether the new IP address and host name are correct. Forcibly synchronize the host name and IP address.
CMDLINE_NEW_IP=New IP address. If the IP address is not specified, the login IP address is used as the new IP address.
CMDLINE_NEW_HOST=New host name. The new host name must be used with the -force parameter. If the host name is not specified, the new host name is automatically detected.
CMDLINE_ADDCOMPONENT=Add component.
CMDLINE_DELCOMPONENT=Delete component.
CMDLINE_COMPONENTNAME=Specify the component name. Note that the component name is case sensitive.
CMDLINE_QUOTE_IPADDR=IP address. The format is xxx.xxx.xxx.xxx.
CMDLINE_QUOTE_PORT=Port, which is composed of 4 to 6 digits.
CMDLINE_QUOTE_PWD=Password, which is composed of multiple characters
CMDLINE_QUOTE_HOSTNAME=Host name, which is composed of multiple characters.
CMDLINE_QUOTE_FLAG=local or remote
CMDLINE_QUOTE_PATH=Path of the file or directory. It is recommended to use the relative path.
CMDLINE_QUOTE_HATYPE=HA type. 0: single server 1: Veritas hot standby 2: Veritas warm standby 3: Watchman 4: Sun Cluster local HA 5: Huawei 1:N cold standby
CMDLINE_QUOTE_SYSNAME=Specify the deployment package name. You can run the listsys command to view the deployment package. Note that the deployment package name is case sensitive.
