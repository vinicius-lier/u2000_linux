IsBackupPage.title = Back up OSS applications and database
IsBackupPage.content = Back up OSS application pragrams and database if necessary.\nSelect Yes and the system automatically backs up the programs; \nSelect No and the programs directly go to the patch installation stage.\nIt is recommended you select Yes for the program can automatically roll back to the \npre-installation state if a patching error occurs.\nIf you select No, manually back up OSS programs and database in advance. \nIf a patching error occurs, the program prompts you to restore the OSS manually. 
IsBackupPage.yes = Yes
IsBackupPage.no = No
IsBackupPage.cmd = Back up OSS applications and database
IsBackupPage.titleforclient = Back up OSS client or not
IsBackupPage.contentforclient = Back up OSS client if necessary.\nSelect Yes and the system automatically backs up the programs;\nSelect No and the programs directly go to the patch installation stage.\nIt is recommended you select Yes for the program can automatically roll back to the \npre-installation state if a patching error occurs.\nIf you select No, manually back up the OSS client in advance. \nIf a patching error occurs, the program prompts you to restore the OSS manually. 