SelectClientInstallFolder.DirectoryMustBeCharAndNum_windows=1.The folder name cannot contain characters *, ?, /, !, ", <, >, |, %, ^, &, ;, #, (, ), : and +. \n2.The length of installation path cannot exceed 60 characters. \n3.The installation directory must be empty. \n4.Root directory of the driver or system cannot be selected. \n5.There cannot be more than one consecutive "\" or "/" and space before "\" or ":". \n6.There cannot be "." in the beginning or in the end of the installation directory name. \n7.The installation path must be an absolute path.
SelectClientInstallFolder.DirectoryMustBeCharAndNum=1.The folder name cannot contain characters *, ?, \, !, ", <, >, |, %, ^, &, ;, #, (, ) and +. \n2.The length of installation path cannot exceed 60 characters. \n3.The installation path cannot be empty and cannot contain space. \n4.Root directory of the driver or system cannot be selected. \n5.There cannot be more than one consecutive "\" or "/" and space before "/". \n6.There cannot be "." in the beginning or in the end of the installation directory name. \n7.The installation path must be an absolute path.
