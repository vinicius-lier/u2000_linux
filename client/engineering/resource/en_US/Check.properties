InvalidIP=The entered IP address is invalid.

Check_type=Check Mode
Select_upgrade=Pre-upgrade check

CheckOS_SystemDirSize.CheckInfo=Check the available space of the OS path
CheckOS_SystemDirSize.CheckResult.windows=The available space of the OS partition @SystemDir is less than @RequireSize. Deleting useless files is recommended. You must ensure that the available space of the OS partition @SystemDir is larger than 1 GB
CheckOS_SystemDirSize.CheckResult.solaris=The available space of the OS path @SystemDir is less than @RequireSize. Run the df -h command to view usage information about the OS path @SystemDir
CheckOS_SystemDirSize.CheckResult.linux=The available space of the OS path @SystemDir is less than @RequireSize. Run the df -h command to view usage information about the OS path @SystemDir
CheckOS_SystemDirPermission.CheckInfo=Check permissions on the OS path
CheckOS_SystemDirPermission.CheckResult.solaris=The permissions on the OS path @SystemDir are at a lower level than the @PathPermission. Run the ls -ld @SystemDir command to view the permissions on the OS path. Running the chmod @PathPermission @SystemDir command to change the permissions is recommended
CheckOS_EtcHosts.CheckInfo=Check the validity of the hosts file in the /etc path
CheckOS_EtcHosts.CheckResult.IteranceIP=A duplicate IP address exists in the hosts file in the /etc path. Use the vi editor to change the IP address and then restart the OS for the change to take effect
CheckOS_EtcHosts.CheckResult.invaildIP=The invalid IP address @invaildIP exists in the hosts file in the /etc path. Use the vi editor to change the invalid IP address. Then, restart the OS to make the change take effect
CheckOS_EtcHosts.CheckResult.SystemIP=The system file /etc/hosts must contain one system IP address. Run the cat /etc/hosts | grep loghost command to check whether no or multiple system IP addresses are contained. The IP address marked "loghost" is the system IP address.
CheckOS_EtcHosts.CheckResult.invaildHostname=The system host name obtained by using the hostname command does not match the counterpart set in the hosts file in the /etc path. Use the vi editor to change the system host name in the file /etc/hosts. Then, restart the OS to make the change take effect
CheckOS_FreeMemory.CheckInfo=Check the memory usage of the OS
CheckOS_FreeMemory.CheckResult=The current memory size of the OS is @TotalMem MB and the available space of the OS memory is @FreeMem MB. That is, the available memory size is less than 30% of the total size. Stopping unnecessary programs or restarting the OS is recommended to release memory resources
CheckOS_FreeSwap.CheckInfo=Check the swap usage of the OS
CheckOS_FreeSwap.CheckResult=The current swap size of the OS is @TotalMem MB and the available space of the OS memory is @FreeMem MB. That is, the available swap size is less than 30% of the total size. Stopping unnecessary programs or restarting the OS is recommended to release memory resources
CheckOS_IPHosts.CheckInfo=Check IP address settings for the OS
CheckOS_IPHosts.CheckResult=The IP address obtained by using the ifconfig -a command is inconsistent with the IP address set in the hosts file in the /etc path. Change the IP address set in the hosts file. Then, restart the OS to make the change take effect
CheckOS_LoopIP.CheckInfo=Check loopback IP address settings for the OS
CheckOS_LoopIP.CheckResult.etchosts=The loopback IP address is not set in the hosts file in the /etc path. Add "127.0.0.1       localhost" to the hosts file. Then, restart the OS to make the change take effect
CheckOS_LoopIP.CheckResult.ifconfig=The loopback IP address cannot be obtained by using the ifconfig -a command. Restart the OS to make the loopback IP address take effect.
CheckOS_UserAdd.CheckInfo=Check whether a user can be added for the OS
CheckOS_UserAdd.CheckResult=Currently, user ossuser cannot be added properly. Check whether the passwd and shadow files in the /etc path are corrupted, or run the pwconv command to restore the file
CheckOS_MaxShareMemory.CheckInfo=Check the maximum shared memory of the OS
CheckOS_MaxShareMemory.CheckResult.maxsharememory=Check the settings of the maximum shared memory parameter shminfo_shmmax in the system file /etc/system. For details, follow the instructions in the OSS installation or upgrade guide.
CheckOS_MaxShareMemory.CheckResult.rlim_fd=You must set rlim_fd_max and rlim_fd_cur in the file /etc/system. For details, see the OSS installation or upgrade guide
CheckOS_SingleLogin.CheckInfo=Check whether login to the OS is in single-user mode
CheckOS_SingleLogin.CheckResult=The following users have logged in to the OS: @loginUser. Ensure that only one user has logged in to the OS before the installation or upgrade. This can reduce the problems caused by user login conflicts
CheckOS_SybaseOwnerGroup.CheckInfo=Check whether the "@pathName" directory and the respective group are consistent with configurations in the global configuration file "sysconfigure_install.xml"
CheckOS_SybaseOwnerGroup.CheckResult="@pathName" directory belongs inconsistent combination of the global configuration file, use command "chown -RH @dbuser:@dbgroup @pathName" to change the owner and/or group for "@pathName" directory.If "@pathName" is a link, please use command"chown -h @dbuser:@dbgroup @pathName" to change link's owner and/or group after executing first command.
CheckOS_AllNodeOssuser.CheckInfo=Check whether the OSS user is normal
CheckOS_AllNodeOssuser.CheckResult=The OSS user @ossUser of OS @ipAddress does not exist. Verify that preconfigurations of the server system are correct by referring to the installation guide.
CheckOS_AllNodeOssuser.Exception=Network exceptions occur, resulting in a failure to check the OSS user @ossUser of OS @ipAddress remotely. Please retry later. 
CheckOS_AllNodeOssuser.ErrorMgr=Failed to obtain the OSS user name from the global configuration file /etc/OSSENGR/sysconfigure_install.xml. Please check.
CheckNMS_SupportUTF8.CheckInfo=Check whether the OS supports the UTF-8 character set.
CheckNMS_SupportUTF8.CheckResult=Currently, the UTF-8 character set has not been installed. For details about how to install the OS character set, see the associated part in the upgrade guide
CheckNMS_NetPort.CheckInfo=Check whether port [ @PORT ] of the MSuite is being used
CheckNMS_NetPort.CheckResult.solaris=The port of the MSuite is being used. Run the /usr/bin/netstat -an -P tcp | grep port number command to view the port status
CheckNMS_NetPort.CheckResult.linux=The port is being used by the process with the ID of @PORCINFO. Restarting the OS or stopping the process is recommended to release port resources. Generally, the process of releasing port resources takes 2 to 3 minutes. Run the netstat -ano | findstr port number command to view the port status
CheckNMS_NetPort.CheckResult.windows=The port is being used by the @PORCINFO process. Restarting the OS or stopping the process is recommended to release port resources. Generally, the process of releasing port resources takes 2 to 3 minutes. Run the netstat -ano | findstr port number command to view the port status
CheckNMS_ClearScript.CheckInfo=Check the pending file on the OSS
CheckNMS_ClearScript.CheckResult=A pending file has been created during the previous OSS installation. You must restart the OS before installing or upgrading the OSS
CheckNMS_DeploySvrProc.CheckInfo=Check the server of the MSuite
CheckNMS_DeploySvrProc.CheckResult=During the running of the MSuite, stop the server of the MSuite. For details, see the OSS administrator guide
CheckNMS_LangCfgCharset.CheckInfo=Check the language configuration file of the OS
CheckNMS_LangCfgCharset.CheckResult.linux=In the language file in the /etc/sysconfig path, the value of the RC_LANG parameter does not meet the OSS requirement. Change the value of the RC_LANG parameter to @LANG. Then, restart the OS to make the change take effect
CheckNMS_LangCfgCharset.CheckResult.solaris=In the TIMEZONE file in the /etc path, the value of the LANG parameter does not meet the OSS requirement. Change the value of the LANG parameter to LANG=@LANG. Then, restart the OS to make the change take effect
CheckNMS_LangCharset.CheckInfo=Check the OS language
CheckNMS_LangCharset.CheckResult=The OS language is not @Lang, which does not meet the OSS requirement. Run the echo $LANG command to view the current OS language. Run the export LANG= @Lang command to change the language environment variable of the OS
CheckNMS_NmsUser.CheckInfo=Check whether the @OSSUSER user is used to start processes
CheckNMS_NmsUser.CheckResult=Certain processes are started by the @OSSUSER user. Use the ps -ef | grep @OSSUSER command to view information about the processes started by the ossuser user
CheckDB_DatabaseStatus.CheckInfo=Check the health condition of the user database
CheckDB_DatabaseStatus.CheckResult=The user database @DBNAME is running improperly. Run the database command use database name to check the database status
CheckDB_DatabaseInUsing.CheckInfo=Check whether the user database is being used
CheckDB_DatabaseInUsing.CheckResult=The user database @DBNAME is being used. Run the database command sp_who to view the database usage information and check whether the OSS is running and whether third-party software is connected to the database
CheckDB_InputDBLogonInfo.CheckInfo=Connect to the database
CheckDB_InputDBLogonInfo.CheckResult=Connection to the database failed or database check cancelled
CheckDB_DatabaseSize.CheckInfo=Check the available space of the database
CheckDB_DatabaseSize.CheckResult=The available space of the database @DBNAME is less than 10% of the total space. Run the database command sp_helpdb database name to view details
CheckDB_DatabaseSingleMode.CheckInfo=Check whether the login to the database is in single-user mode
CheckDB_DatabaseSingleMode.CheckResult=Currently, multiple users have logged in to the database. Use the database command sp_who to view information about database users. You must ensure that the login to the database is in single-user mode before the installation or upgrade
CheckDB_SqlCommand.CheckInfo=Check database commands, such as isql, bcp, osql, and sqlplus
CheckDB_SqlCommand.CheckResult.isql=Execution of isql commands failed. Running the "isql -Uadminuser name -Ppassword -Sservicename" command is recommended to view details about the cause of the failure
CheckDB_SqlCommand.CheckResult.osql=Execution of osql commands failed. Running the "osql -Uadminuser name -Ppassword -Sservicename" command is recommended to view details about the cause of the failure
CheckDB_SqlCommand.CheckResult.bcp=Execution of bcp commands failed. Running the "bcp master..sysdatabases out testbcp.out -c -Uadminuser name -Ppassword -Sservicename" command is recommended to view details about the cause of the failure
CheckDB_SybaseInterface.CheckInfo=Check the network configuration file interfaces in the Sybase database path <br> @SYBASEPATH 
CheckDB_SybaseInterface.CheckInfoCMD=Check the network configuration file interfaces in the Sybase database path @SYBASEPATH 
CheckDB_SybaseInterface.CheckResult.invaildIP=An invalid IP address exists in the configuration file or no IP address is set. Do as follows to change the IP address: Shut down the database, change the invalid IP address or set an IP address, and then restart the database
CheckDB_SybaseInterface.CheckResult.getIPFailed=Failed to obtain IP addresses from @SYBASEPATH/interfaces
CheckDB_SybaseInterface.CheckResult.NotMatchIP=The IP address obtained from the @SYBASEPATH/interfaces does not match the IP address in the hosts file /etc/hosts. Check whether the IP address in the hosts file in t/etc/hosts is correct
CheckDB_SybaseBackupSvr.CheckInfo=Check whether the backup service of the Sybase database has been started
CheckDB_SybaseBackupSvr.CheckResult=The backup service is not started. Start the backup service of the Sybase database. For details, see the information about how to start the database in the associated guide
CheckDB_DBRunningCfg.CheckInfo=Check database configurations
CheckDB_DBRunningCfg.CheckResult=Compare current database configurations with the counterparts required by the OSS. Check whether the following database configurations are correct: @errDBSvrCfg Incorrect database configurations lead to abnormal database operations
Patch_PreCheck.CheckInfo=Executing @component precheck, script @script.
Patch_PreCheck.CheckResult=Failed to execute precheck script.
Patch_PreCheck.CheckResultNotFound=Script not found.
