jLbTitle=<html><p>Engineering Assistant is used to check software and hardware environment and database status for the server.</p><p>Select a scenario from the drop-down list. If the environment is abnormal, view details about the abnormality and the associated solution.</p></html>
jLbTitleCMD=Engineering Assistant:
introduceCMD=Check OS and database related items that are associated with installation and upgrade. If certain check items fail to be executed, refer to the Operation Guide to view associated information or modify the check items.
SelectCheckTypeCMD=Select Check Mode:
inputInvaildCMD=Invalid value. Please enter another value
