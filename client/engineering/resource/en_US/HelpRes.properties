com.oss.engineering.business.install.gui.LicensePage=Select an OSS installation mode. Three options are available:\n1. Using the license file: The OSS is installed according to the installation policy automatically generated by the license file. 2. Using the predefined deployment file: The OSS is installed according to the installation policy in the predefined deployment file. 3. Installing the OSS manually: Skillful users can customize the installation policy.
com.oss.engineering.core.install.gui.NodeInfoTable=Configure information about the OSS server. \nIf the server has multiple IP addresses, the default IP address is not displayed and you need to enter a correct IP address. \nTo install a single-server system, you only need to modify server parameters instead of performing the add or delete operation. \nTo install a distributed system, you can either modify server parameters or add or delete a server.
com.oss.engineering.core.install.gui.DeploymentSchemeSubsystem=Configure the installation component information of the iManager OSS in this page.
com.oss.engineering.core.install.gui.ConfigDBServer=Configure the database information about database installation. If the database is already installed on the server, the installation program checks the access from database users by the password and asks you whether to reuse the installed database or install a new one.\nReusing the installed database or installing a new one will overwrite the data of the installed database. Therefore, back up the data in the installed database first.
com.oss.engineering.core.install.page.Summary=This page displays summary information about OSS installation.
