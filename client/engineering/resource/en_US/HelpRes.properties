com.oss.engineering.core.install.gui.ProgressPage=This page displays progress information about OSS installation. The installation procedure consists of six steps: 1. Initialize the data model of the OSS; 2. Execute pre-scripts; 3. Install an OSS client; 4. Install database software of the OSS; 5. Install OSS components and deploy instances for the components; 6. Execute post-scripts.
