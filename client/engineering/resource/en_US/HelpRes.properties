com.oss.engineering.business.install.page.SelectStyle=Select an OSS installation style. If the default installation type is selected, the alarm level is set to "Warning". If the North America Style is selected, the alarm level is set to "Not Alarm".
com.oss.engineering.business.install.page.SelectSlotMode=Select a proper timeslot mode. The transport network management of the Huawei OSS supports two VC12 numbering modes at VC4 timeslot: sequential and interleaved. The sequential mode complies with the ITU-T Recommendation G.707 and is a numbering policy recommended by the ITU-T G.707. In this mode, the calculation formula of VC12 serial number is as follows: VC-12 serial number = TUG-3 + (TUG-2 - 1) x 3 + (TU-12 - 1) x 21. The interleaved mode is a numbering policy for optimizing the VC3 trail. In this mode, the calculation formula of VC12 serial number is as follows: VC-12 serial number = (TUG-3 - 1) x 21 + (TUG-2 - 1) x 3 + TU-12.
