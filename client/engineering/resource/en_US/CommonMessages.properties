Complex_pad_tip=<html>Password requirements:<br>&nbsp;1. The password contains a minimum of 8 characters and a maximum of 30 characters.<br>&nbsp;2. The password must contain at least four of the following combinations:<br>&nbsp;&nbsp;&nbsp;&nbsp;At least one uppercase letter; <br>&nbsp;&nbsp;&nbsp;&nbsp;At least one lowercase letter; <br>&nbsp;&nbsp;&nbsp;&nbsp;At least one digit;<br>&nbsp;&nbsp;&nbsp;&nbsp;At least one special character: ~@#^*-_+[{}]:./? <br>&nbsp;3. The password cannot be any user name or user name in reverse order.<br>&nbsp;</html>

Sybase_complex_pad_tip=<html>Password requirements:<br>&nbsp;1. The password contains a minimum of 8 characters and a maximum of 30 characters.<br>&nbsp;2. The password must contain at least four of the following combinations:<br>&nbsp;&nbsp;&nbsp;&nbsp;At least one uppercase letter; <br>&nbsp;&nbsp;&nbsp;&nbsp;At least one lowercase letter; <br>&nbsp;&nbsp;&nbsp;&nbsp;At least one digit;<br>&nbsp;&nbsp;&nbsp;&nbsp;At least one special character: ~@#^*-_+[{}]:./? <br>&nbsp;3. The password cannot be any user name or user name in reverse order.<br>&nbsp;4. The password cannot contain user names and is case-insensitive.<br>&nbsp;</html>


