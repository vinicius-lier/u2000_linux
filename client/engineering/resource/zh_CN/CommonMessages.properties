Complex_pad_tip=<html>密码要求：<br>&nbsp;1. 密码必须是8-30个字符长。<br>&nbsp;2. 密码必须包含如下四种字符的组合：<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个大写字母；<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个小写字母；<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个数字；<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个特殊字符： ~@#^*-_+[{}]:./?<br>&nbsp;3. 密码不能和帐号或者帐号的倒写一样。<br>&nbsp;</html>
Sybase_complex_pad_tip=<html>密码要求：<br>&nbsp;1. 密码必须是8-30个字符长。<br>&nbsp;2. 密码必须包含如下四种字符的组合：<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个大写字母；<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个小写字母；<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个数字；<br>&nbsp;&nbsp;&nbsp;&nbsp;至少一个特殊字符： ~@#^*-_+[{}]:./?<br>&nbsp;3. 密码不能和帐号或者帐号的倒写一样。<br>&nbsp;4. 密码不能包含用户名并且不区分大小写。<br>&nbsp;</html>

