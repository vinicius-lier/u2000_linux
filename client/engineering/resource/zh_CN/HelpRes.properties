
com.oss.engineering.core.install.page.Introduction=这是安装的帮助页面，将指导您一步一步的完成网络管理系统的安装。
com.oss.engineering.core.install.page.CopyRight=此页列出网络管理系统的版权信息，请认真阅读。
com.oss.engineering.core.install.page.SelectLanguage=请选择安装后，网络管理系统版本的语言。
com.oss.engineering.business.install.page.CopyFiles=安装网络管理系统客户端过程信息。
com.oss.engineering.core.install.page.ExitPage=已完成网络管理系统的安装。
com.oss.engineering.business.install.gui.LicensePage=请选择网络管理系统的安装方式，分为3种：1、license文件安装：根据license文件自动生成安装策略进行网管安装；2、预定义部署文件安装：根据事先定义好的安装配置策略进行网管安装；3、手工安装：适合于有经验人员使用，能完全自定义安装策略。
com.oss.engineering.core.install.gui.NodeInfoTable=请配置网管服务器信息。\n如果该服务器有多个IP，则不显示默认IP，需要手工输入正确的IP。\n安装单机系统，只需要修改服务器参数，不需要进行增加服务器和删除服务器的操作。\n安装分布式系统，可以进行修改服务器参数，增加服务器和删除服务器的操作。
com.oss.engineering.business.install.gui.DeploymentSchemeSubsystem=请选择在网管务器上需要安装的组件，以及实例。
com.oss.engineering.business.install.gui.ConfigDBServer=请配置数据库服务器信息，用于安装数据库服务器。如果检查服务器已经安装了数据库，会根据用户输入的密码信息，对数据库用户进行连接检查，并提示用户是否复用已安装的数据库或者重新安装。\n复用已安装数据库或者重新安装数据库会破坏已有的数据库数据，请先备份数据库数据。
com.oss.engineering.core.install.page.Summary=显示网管安装的汇总信息。
com.oss.engineering.core.install.gui.TestDeploy=各组件配置信息。
com.oss.engineering.core.install.gui.ProgressPage=显示网管安装进度信息，主要有以下六个步骤：1、初始化数据模型；2、执行前置脚本；3、安装网管客户端；4、安装网管数据库软件；5、安装网管组件和部署实例；6、执行后置脚本。
