com.oss.engineering.business.install.gui.SelectInstallType=请选择网管的安装类型。
com.oss.engineering.core.install.page.SelectInstallFolder=请选择网管的安装目录。
com.oss.engineering.business.install.page.SelectSlotMode=请选择合适的时隙模式。网络管理系统传送网络管理支持两种VC12在VC4时隙编号模式：一种是顺序模式（符合ITU-T G.707建议），另外一种是间插模式。顺序模式是ITU-T 在G.707 中建议的编号策略，顺序模式VC12 编号的计算公式为：VC-12 编号＝ "TUG-3" + ("TUG-2" - 1) × 3 + ( "TU-12" - 1) × 21，间插模式是优化VC3 路径的编号策略，间插模式VC12 编号的计算公式为：VC-12 编号＝("TUG-3" - 1) × 21 + ( "TUG-2" - 1) × 3 + "TU-12"。
com.oss.engineering.business.install.page.SelectStyle=请选择网络管理系统的安装版本风格。两种风格区别在于告警级别"提示"的表示：默认风格设置为"Warning"；北美风格设置为"Not Alarm"。
