#HTML style ToolTip, design for complex filter condition
Filter.multiValue.tips.string = <html> Different values are allowed and can be separated by commas.

Filter.multiValue.tips.int  = <html> You can enter multiple values, which are separated by commas.<BR>\
                                For example, the input of "1,5,6" represents the data of parameter 1, 5, or 6 are output. <BR>\
                                Besides, we can input "start_value-end_value" to represent a value range. <BR>\
                                For example, the input of "0-5" represents (0 &lt;= parameter &lt;= 5).<BR>\
                                The character "-" is used between the start_value and the end_value.<BR>\
                                We can also use the two rules together.<BR>\
                                For example, the input of "1,10,3-7" represents ((parameter = 1) or (parameter = 10) or (3 &lt;= parameter &lt;= 7)).
