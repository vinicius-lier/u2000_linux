#platform version
platform_version=iMAPV200R008C01B023

#the executable file name of client upgrade 
update_jre_file = ./jre/bin/java -Djava.library.path=./update/lib
update_main_class = 
update_application_paras=
update_lib_files = ./update/lib/clientupdate.jar;./lib/iview.jar

#the filechooser default path
iview.filechooser.defaultpath=report

module.groupmode = 1

#the module load mode 0-MULTITHREAD_LOAD;1-SINGLETHREAD_LOAD
iview.modulemanager.loadmode=0

#客户端在外网，必须配置use_all_ip=true ，以解决外网客户端无法访问服务器mrb,em,cau,hedex等服务的问题
# 与平台的renhang 00100691/huawei确认
# if client at outer network, the configuration is must ,solve outer network it can not connection problem
use_all_ip = true

#ToolTip delay time
iview.tooltip.delaytime = 60

#System setting - displace setting visible
iview.systemsetting.displaceSettingVisible=true

#by haocong resolve ssl problem
jsse.enableCBCProtection=false

#bootstrap loader used.You needn't config this property if you don't use the function of bootstrap
#patch path
boot_patch_dir=./lib/patch/*.jar
#other class path
boot_classpath=
#app main class
boot_mainclass=com.swimap.iview.framework.Main
#help class path
boot_helpclasspath=lib/iview.jar;lib/helpSupportLib/jhall.jar;lib/iviewlib.jar

