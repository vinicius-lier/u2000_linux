Service_NonexistLoginErrorDetails=1.客户端和服务器的安全模式不一致。对比客户端登录对话框中的安全模式和从系统管理员处获取的服务端的安全模式。如果二者不一致，将登录对话框中服务器的模式修改为和服务器模式一致。\n2.和服务器的网络连接不正常。在命令行中输入“ping 服务器IP”检查通信连接是否成功，如果不成功，请检查网口和网线是否能正常工作。\n3.服务器状态异常或版本不匹配。联系系统管理员检查服务器的服务状态和版本。\n4.服务器端口无法到达。请先查看登录对话框中服务器配置的端口，然后联系系统管理员确认服务器提供服务的端口。如果二者不一致，将登录对话框中服务器的端口修改为和服务器一致。\n5.SSL证书已经过期。请检查客户端的证书是否过期。\n6.客户端在线个数已经超过最大连接数。请联系系统管理员。
