#对各种布局的描述
SpringLayoutDesc=有连接关系的{#Device.attributeSubnetLowcase#}与节点尽量在一起，每次的布局结果可能彼此不同。
UnionLegthLayoutDesc=每个{#Device.attributeSubnetLowcase#}或节点间连接长度尽量一致。没有连接关系的{#Device.attributeSubnetLowcase#}或节点不进行布局。每次的布局结果可能彼此不同。
TreeLayoutDesc=根据{#Device.attributeSubnetLowcase#}或节点的连接关系，以树状的形式进行布局，若没有连接关系，{#Device.attributeSubnetLowcase#}或节点之间隔开一定距离从左到右开始布局。每次的布局结果可能彼此不同。
StarLayoutDesc=中心有{#Device.attributeSubnetLowcase#}或节点，其余{#Device.attributeSubnetLowcase#}和节点按照指定的节点距离均匀分布在圆周上，每次的布局结果可能彼此不同。
RingLayoutDesc=所有的{#Device.attributeSubnetLowcase#}或节点按照指定的节点距离均匀分布在圆周上。
GridLayoutDesc=以表格的形式(但没有表格的边框)从拓扑界面的左上角开始，按照从左到右的顺序布局{#Device.attributeSubnetLowcase#}或节点。
SnmpEngineIDToolTip=<html>支持两种输入模式：<br>1．直接输入字符串；<br>2．十六进制输入模式：格式为#**.**.**，必须以#号开始，数字和数字之间用小数点隔开。</html>
