CreateClusterPanel.title=Large-Capacity DSLAM Cluster
CreateClusterPanel.desc=Configure the large-capacity DSLAM cluster. Large-capacity DSLAM cluster management allows the network administrator to manage multiple modules by using the public IP address of a main module. After the cluster is created, the user can configure the server, EMS host, and log host for the cluster through the commander device. The cluster members access the server through the commander device. After this operation is performed successfully, the alarm report function is realized.

