Audit_Query=控制功能：该权限用于查询网管操作日志，比如创建网元、删除网元等。 \n\n提醒：系统管理员和安全管理员可以查询所有用户的操作日志，子域安全管理员可以查询自身管理用户的操作日志，普通用户只能查看自己的操作日志。\n\n特殊说明：无。
Audit_Template_Setting=控制功能：该权限可设置网管操作日志模板。 \n\n提醒：无。\n\n特殊说明：无。
Manage_Log=控制功能：该权限是网管日志的基本权限。 \n\n提醒：授予其它日志权限会自动授予该权限。\n\n特殊说明：无。
Query_SNMP_Device_Log=控制功能：该权限用于查询SNMP类型的设备日志。 \n\n提醒：无。\n\n特殊说明：无。
Refresh_SNMP_Device_Log=控制功能：该权限用于同步全网SNMP类型的设备日志。 \n\n提醒：无。\n\n特殊说明：无。
SystemLog_Query=控制功能：该权限用于查询网管系统日志，比如网管启动、网管定时任务等。 \n\n提醒：无。\n\n特殊说明：无。
SystemLog_Template_Setting=控制功能：该权限可设置网管系统日志模板。 \n\n提醒：无。\n\n特殊说明：无
