Audit_Query=Function: To view OSS operation logs, such as NE creation and deletion logs.  \n\nNote: The administrator and security management users can view all users' operation logs. SSA users can view the operation logs of their managed users. Common users can view their own operation logs. \n\nDescription: None
Audit_Template_Setting=Function: To set an operation log template.  \n\nNote: None \n\nDescription: None
Manage_Log=Function: Basic permission for OSS logs.  \n\nNote: This permission is granted along with any other permission. \n\nDescription: None
Query_SNMP_Device_Log=Function: To view SNMP device logs.  \n\nNote: None \n\nDescription: None
Refresh_SNMP_Device_Log=Function: To synchronize SNMP device logs in the entire OSS.  \n\nNote: None \n\nDescription: None
SystemLog_Query=Function: To view system logs, such as OSS startup logs and task scheduling logs.  \n\nNote: None \n\nDescription: None
SystemLog_Template_Setting=Function: To configure an OSS log template.  \n\nNote: None \n\nDescription: None
