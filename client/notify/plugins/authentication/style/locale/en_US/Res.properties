SM_UNLOCK_IES_BIND_AUTH_BAD_PARAM=Failed to unlock the terminal. Information configured for the user using the third-party system access is incorrect. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_NOT_VALID=Failed to unlock the terminal. Check whether the name and password you configured for the user using the third-party system access are correct. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_NOT_VALID_LOCKED=Failed to unlock the terminal. The user using the third-party system access is locked, because the number of its login attempts has reached the maximum. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_PWD_EXPIRED=Failed to unlock the terminal. The password of the user using the third-party system access expired. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_CONN_ERROR=Failed to unlock the terminal. Failed to connect to the centralized authentication server. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_DATA_ERROR=Failed to unlock the terminal. The remote server is abnormal. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_CANNOT_LOGIN_TO_SERVER=Failed to unlock the terminal. The user using the third-party system access is not authorized to log in. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_USER_LOCKED=Failed to unlock the terminal. The user using the third-party system access is locked. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_USER_INVALID=Failed to unlock the terminal. The user using the third-party system access is disabled. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_INVALID_IP=Failed to unlock the terminal. The system administrator does not allow the user using the third-party system access to log in from the current machine. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_NOT_IN_VALIDDAYS=Failed to unlock the terminal. The user using the third-party system access is not allowed to log in within the current period. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_NEED_CHGPWD_NEXT_LOGIN=Failed to unlock the terminal. The password of the user using the third-party system access needs to be changed. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_REACH_ONLINE_LIMIT=Failed to unlock the terminal. The number of online users using the third-party system access has reached the maximum. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_PWD_WILL_EXPIRED=Failed to unlock the terminal. The password of the user using the third-party system access will expire in {0} days. Contact the system administrator. Click OK to return to the login page.
SM_UNLOCK_IES_BIND_AUTH_UNKOWN_ERROR=Failed to unlock the terminal. The remote server is abnormal. Contact the system administrator. Click OK to return to the login page.

