Service_NonexistLoginError=The client failed to connect to the server. See the information below for the failure cause.
Service_NonexistLoginErrorDetails= 1. The security modes on the client and server are inconsistent. Compare the security mode in the login dialog box of the client with the security mode on the server that is obtained from the system administrator. If the security modes are inconsistent, synchronize the mode in the dialog box with that on the server.\n2. The connection to the server is abnormal. Ping the server IP address to check the connection or check whether the network port and cables are running properly.\n3. The server is abnormal or the version is incompatible. Contact the system administrator.\n4. The server port is unreachable. Check the configured server port in the login dialog box with the system administrator. If the port does not match the actual server port, change the port in the dialog box to the actual server port.\n5. The SSL certificate has expired. Check whether the SSL certificate on the client has expired.\n6. The number of clients connected to the server has reached the maximum value. Contact the system administrator.\n7. An exception occurred in the database. Please check.

